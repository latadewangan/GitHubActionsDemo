name: Add Numbers

on:
  workflow_dispatch:
    inputs:
      number1:
        description: "First Number"
        required: true
      number2:
        description: "Second Number"
        required: true

jobs:
  add_numbers:
    runs-on: ubuntu-latest

    steps:
      - name: Add numbers
        id: sum
        run: |
          result=$((${{ inputs.number1 }} + ${{ inputs.number2 }}))
          echo "sum=$result" >> $GITHUB_OUTPUT

      - name: Display sum
        run: |
          echo "The sum of ${{ inputs.number1 }} and ${{ inputs.number2 }} is ${{ steps.sum.outputs.sum }}"
